<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配色方案对比 · 婚礼邀请函</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif SC','Songti SC',serif;background:#F5F2EC;color:#3A3A3A;padding:48px 20px 64px}
.wrap{max-width:460px;margin:0 auto}
h1{font-size:20px;letter-spacing:.3em;text-align:center;font-weight:600}
.sub{text-align:center;font-size:12px;color:#999;margin-top:10px;letter-spacing:.15em}
.card{display:block;text-decoration:none;color:inherit;background:#fff;margin-top:22px;padding:18px 20px;border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.card .name{font-size:16px;font-weight:600;letter-spacing:.1em}
.card .desc{font-size:12px;color:#999;margin-top:4px;letter-spacing:.06em}
.sw{display:flex;gap:6px;margin-top:12px}
.sw i{flex:1;height:34px;border-radius:3px}
.go{text-align:right;font-size:12px;color:#B08D6F;margin-top:10px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap">
  <h1>配色方案对比</h1>
  <div class="sub">点开每一款，向下滑动感受整页效果</div>

  <a class="card" href="demo-a/index.html">
    <div class="name">A 款 · 花园橄榄</div>
    <div class="desc">蛋壳白 + 橄榄绿 + 灰桃粉 —— 清新花园感</div>
    <div class="sw"><i style="background:#f2eee8;border:1px solid #eee"></i><i style="background:#6f7f6a"></i><i style="background:#d9a3a0"></i><i style="background:#e7c6c1"></i><i style="background:#afc3b1"></i></div>
    <div class="go">查看 →</div>
  </a>

  <a class="card" href="demo-b/index.html">
    <div class="name">B 款 · 海玻璃绿</div>
    <div class="desc">雾白 + 海玻璃绿 + 砂金雪花粉 —— 干净氧气感</div>
    <div class="sw"><i style="background:#f5f6f4;border:1px solid #eee"></i><i style="background:#6f8676"></i><i style="background:#deac97"></i><i style="background:#f2e6c9"></i><i style="background:#b7c4b4"></i></div>
    <div class="go">查看 →</div>
  </a>

  <a class="card" href="demo-c/index.html">
    <div class="name">C 款 · 裸棕奶茶</div>
    <div class="desc">米白 + 裸棕奶茶 —— 温柔高级的法式中性调</div>
    <div class="sw"><i style="background:#ebe5de;border:1px solid #eee"></i><i style="background:#9b8578"></i><i style="background:#b99f83"></i><i style="background:#cabaad"></i><i style="background:#dbd1c7"></i></div>
    <div class="go">查看 →</div>
  </a>

  <a class="card" href="index.html">
    <div class="name">当前版 · 酒红粉金</div>
    <div class="desc">羊绒米 + 柔和酒红 + 莓粉 + 一点雾青 —— 上一轮定稿</div>
    <div class="sw"><i style="background:#f1e4d9;border:1px solid #eee"></i><i style="background:#984343"></i><i style="background:#d79b95"></i><i style="background:#f7d7cd"></i><i style="background:#91bdc2"></i></div>
    <div class="go">查看 →</div>
  </a>
</div>
</body>
</html>
